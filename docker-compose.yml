services:
  adaptador:
    build: .
    container_name: adaptador-curriculo
    # Só acessível pelo próprio computador. Para expor num servidor, troque para "3210:3210"
    # e defina APP_PASSWORD no .env.
    ports:
      - "127.0.0.1:3210:3210"
    env_file:
      - path: .env
        required: false
    volumes:
      # Seus dados ficam no seu computador: currículo base, perfil, saídas e prompts (editáveis sem rebuild)
      - .:/dados
    extra_hosts:
      # Permite usar Ollama / LM Studio rodando no seu computador (http://host.docker.internal:11434/v1)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
